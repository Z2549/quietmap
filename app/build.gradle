plugins {
    id 'com.android.application'
}

// 签名配置从 keystore.properties 读（该文件在 .gitignore 里，不入仓库）。
// 没提供时回退 Android 默认 debug 签名：仓库开箱即可构建，任何人都能装上，
// 只是不能算"正式签名"版本。等自己 keystore 稳定了再补这个文件。

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
// 完整判定：文件存在且 storeFile 已配置。只有一半的 keystore.properties
// （例如只写了 storePassword）同样视为缺失，避免 release 静默退回 debug 签名。
def hasKeystore = keystorePropsFile.exists() && keystoreProps.getProperty("storeFile")

android {
    namespace 'com.quietmap.app'
    // 机器上装的是 platforms;android-35/36；android-37.0 这种目录名 AGP 解析不了，
    // 只能用 36（本模块不碰 37 特有 API）。
    compileSdk 36

    defaultConfig {
        // 仓库新规：新模块包名必须是自有域名或 io.github.[用户名].[模块名]。
        // 这里用后者（自动审批）。Java 包名保持 com.quietmap.app 不变。
        applicationId "io.github.yigenhuobah.quietmap"
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName "0.5.1"
    }

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty("storeFile"))
                storePassword keystoreProps.getProperty("storePassword")
                keyAlias keystoreProps.getProperty("keyAlias")
                keyPassword keystoreProps.getProperty("keyPassword")
            }
        } else {
            // 没有自备 keystore 时，release 显式借用 debug 证书。
            // 必须显式指定：不指定的话 AGP 会产出一个没签名的 APK，
            // 安装时报 INSTALL_PARSE_FAILED_NO_CERTIFICATES。
            release {
                initWith debug
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // 开启 R8 收缩（Material 依赖会让 APK 涨到 10MB 级）。
            // 入口类与回调的 keep 规则见 proguard-rules.pro。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            variant.outputs.all { output ->
                output.outputFileName = "quietmap-${variant.versionName}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }

    packaging {
        jniLibs {
            // DexKit 的 libdexkit.so 必须解压到 nativeLibraryDir 后按绝对路径
            // System.load（宿主进程 java.library.path 里没有模块 so 目录）。
            useLegacyPackaging = true
        }
    }
}

// AAR 元数据检查豁免（仅影响构建期校验，不改任何运行时行为）：
// 1) io.github.libxposed:service:102.0.0 的 AAR 元数据声明 minCompileSdk 37，
//    本机平台目录是 android-37.0（AGP 解析不了），只能 compileSdk 36。
//    该库只做 binder 转发，不使用任何 37 新 API。
// 2) io.github.libxposed:api:102.0.0 的 api-102.0.0.aar 同样带 minCompileSdk=37
//    的 aar-metadata，理由同上；annotation 是普通 jar，不触发该检查。
//    因此受影响的坐标是 service 与 api 两项。
// 3) 行为仍是全局禁用 check*AarMetadata（AGP 的豁免是按任务而非按坐标）。
// 若未来改用 compileSdk 37，把这段删掉即可。
tasks.configureEach { task ->
    if (task.name.startsWith("check") && task.name.endsWith("AarMetadata")) {
        task.enabled = false
    }
}

dependencies {
    // Provided by the framework inside the hooked process; must never be packaged.
    compileOnly 'io.github.libxposed:api:102.0.0'
    compileOnly 'io.github.libxposed:annotation:1.0.0'

    // compileOnly 不拉传递依赖；@NonNull 来自下面的 appcompat/material 传递依赖，
    // 不再单独声明 androidx.annotation，避免与它们的版本约束冲突。

    // service must be PACKAGED, not compileOnly: the manifest declares
    // io.github.libxposed.service.XposedProvider, and it is instantiated inside the
    // module app's own process (compileOnly classes are absent at runtime).
    // XposedProvider only forwards a binder and touches no hooked-process API.
    implementation 'io.github.libxposed:service:102.0.0'

    // UI 只在模块 App 进程用；hook 代码绝不引用这些类，所以不会影响宿主进程。
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'

    testImplementation 'junit:junit:4.13.2'
    // HookKitTest 会加载 HookKit 类，其方法签名引用 XposedInterface.Hooker；
    // 主源码用 compileOnly，编译期可见但 AGP 单测 runtime classpath 不包含它，
    // 故为测试运行期补同一坐标（不新增任何新库，仅补运行期可见性）。
    testImplementation 'io.github.libxposed:api:102.0.0'

    // splash_request 的 Lze5.attemptRequestData 混淆类锚定（dexkit/ 包），
    // 打进模块 APK 供宿主进程内运行时扫描，native so 见 packaging.jniLibs。
    implementation 'org.luckypray:dexkit:2.3.0'
}

// release 必须使用正式签名：keystore.properties 缺失 / storeFile 未配置时，
// 只要本次任务图里出现 release 变体任务就在执行前失败，避免静默产出 debug 签名版本。
// 用 taskGraph.whenReady 覆盖 assemble/package/install/bundle 全部入口；debug 不受影响。
def releaseTaskNames = ["assembleRelease", "packageRelease", "installRelease", "bundleRelease"]
gradle.taskGraph.whenReady { graph ->
    if (!hasKeystore && graph.allTasks.any { it.project == project && releaseTaskNames.contains(it.name) }) {
        throw new GradleException("缺少有效 keystore.properties（storeFile 未配置）：release 构建必须使用正式签名")
    }
}
